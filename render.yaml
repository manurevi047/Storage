services:
  - type: web
    name: file-upload-app
    env: node
    buildCommand: npm install && cd client && npm install && npm run build && cd ..
    startCommand: npm run server
    envVars:
      - key: NODE_VERSION
        value: 18.17.0
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: uploads

